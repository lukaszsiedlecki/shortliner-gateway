server.port=${SERVER_PORT:8084}

spring.application.name=shortliner-gateway

# Behind nginx-ingress: build redirect URIs ({baseUrl}) from X-Forwarded-* so Keycloak
# sends the browser back to http://shortliner.local, not to the pod's address.
server.forward-headers-strategy=framework

keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://keycloak.local/realms/shortliner}
keycloak.internal-uri=${KEYCLOAK_INTERNAL_URI:}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:shortliner-gateway}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}

# Forward the browser-facing Host (shortliner.local) instead of the Service name, so
# backends that build absolute URLs (e.g. redirects) don't leak http://<svc>:<port>/...
spring.cloud.gateway.server.webflux.default-filters[0]=PreserveHostHeader

# Routes keep the /api/<service>/** contract the frontend's own proxy used, so client
# code doesn't change: StripPrefix=2 drops "/api/<service>" before forwarding.
# TokenRelay attaches the logged-in user's access token (no-op for anonymous callers);
# backends never need the browser's session cookie, so it isn't forwarded.
spring.cloud.gateway.server.webflux.routes[0].id=shortliner
spring.cloud.gateway.server.webflux.routes[0].uri=${SHORTLINER_BACKEND_URL:http://localhost:8080}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/shortliner/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webflux.routes[0].filters[1]=TokenRelay=
spring.cloud.gateway.server.webflux.routes[0].filters[2]=RemoveRequestHeader=Cookie

spring.cloud.gateway.server.webflux.routes[1].id=analytics
spring.cloud.gateway.server.webflux.routes[1].uri=${ANALYTICS_BACKEND_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/analytics/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webflux.routes[1].filters[1]=TokenRelay=
spring.cloud.gateway.server.webflux.routes[1].filters[2]=RemoveRequestHeader=Cookie

spring.cloud.gateway.server.webflux.routes[2].id=payment
spring.cloud.gateway.server.webflux.routes[2].uri=${PAYMENT_BACKEND_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/payment/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webflux.routes[2].filters[1]=TokenRelay=
spring.cloud.gateway.server.webflux.routes[2].filters[2]=RemoveRequestHeader=Cookie

# Everything else (pages, static assets) goes to the Next.js frontend. Must stay last:
# routes are matched in order and /** would shadow the API routes above.
spring.cloud.gateway.server.webflux.routes[3].id=frontend
spring.cloud.gateway.server.webflux.routes[3].uri=${FRONTEND_URL:http://localhost:3000}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/**
spring.cloud.gateway.server.webflux.routes[3].order=2147483647

spring.cloud.gateway.server.webflux.httpclient.connect-timeout=${GATEWAY_CONNECT_TIMEOUT_MS:2000}
spring.cloud.gateway.server.webflux.httpclient.response-timeout=${GATEWAY_RESPONSE_TIMEOUT:30s}

management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Metrics (scraped by Prometheus)
management.endpoints.web.exposure.include=health,prometheus,metrics
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# spring-boot-starter-opentelemetry also brings an OTLP metrics registry; metrics are scraped
# by Prometheus, so don't push a second copy.
management.otlp.metrics.export.enabled=false

# Distributed tracing (OpenTelemetry). Export is opt-in until a collector
# endpoint is available; toggle via OTEL_TRACING_EXPORT_ENABLED once one is.
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.tracing.export.otlp.enabled=${OTEL_TRACING_EXPORT_ENABLED:false}

logging.level.com.shortliner.gateway=${LOG_LEVEL_APP:INFO}

# Structured JSON logs (trace/span IDs are included automatically via MDC).
# Unset by default for readable local console output; the homelab chart sets "ecs".
logging.structured.format.console=${LOGGING_STRUCTURED_FORMAT_CONSOLE:}
